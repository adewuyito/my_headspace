name: my_headspace
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # State managment 
  provider: ^6.1.5+1

  # Service Locator
  get_it: ^8.3.0 

  # Ui Optimization 
  flutter_screenutil: ^5.9.3

  # Routing
  auto_route: ^10.2.3

  # Hooks
  flutter_hooks: 0.21.3

  date_field: ^6.0.3
  flutter_svg: ^2.2.3
  intl: ^0.20.2

  # Firebase
  firebase_core: ^4.2.1
  cloud_firestore: ^6.1.0
  firebase_auth: ^6.1.2
  
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  auto_route_generator: ^10.2.6
  lean_builder: ^0.1.3
  build_runner: ^2.10.4
  firebase_auth_mocks: ^0.15.0
  mocktail: ^1.0.4

flutter_gen:
  # Optional
  integrations:
    image: true
    flutter_svg: true

  colors:
    inputs:
      - assets/app_colors.xml

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/montserrat/Montserrat-Thin.otf
          weight: 100
        - asset: assets/fonts/Montserrat-ExtraLight.otf
          weight: 200
        - asset: assets/fonts/Montserrat-Light.otf
          weight: 300
        - asset: assets/fonts/Montserrat-Regular.otf
          weight: 400
        - asset: assets/fonts/Montserrat-Medium.otf
          weight: 500
        - asset: assets/fonts/Montserrat-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.otf
          weight: 700
        - asset: assets/fonts/Montserrat-ExtraBold.otf
          weight: 800
        - asset: assets/fonts/Montserrat-Black.otf
          weight: 900
